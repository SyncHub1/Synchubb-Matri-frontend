<!DOCTYPE html>
<html>
<head>
    <title>Matri API Test</title>
</head>
<body>
    <h1>Matri API Connectivity Test</h1>
    <button onclick="testHealth()">Test Health Endpoint</button>
    <button onclick="testTeams()">Test Teams Endpoint</button>
    <div id="results"></div>

    <script>
        async function testHealth() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing health endpoint...</p>';
            
            try {
                const response = await fetch('http://localhost:3003/health', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                results.innerHTML = `
                    <h3>✅ Health Check Success!</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                results.innerHTML = `
                    <h3>❌ Health Check Failed!</h3>
                    <p>Error: ${error.message}</p>
                    <p>Make sure matri-service is running on port 3003</p>
                `;
            }
        }

        async function testTeams() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing teams endpoint...</p>';
            
            try {
                const response = await fetch('http://localhost:3003/api/v1/teams', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                results.innerHTML = `
                    <h3>✅ Teams API Success!</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                results.innerHTML = `
                    <h3>❌ Teams API Failed!</h3>
                    <p>Error: ${error.message}</p>
                `;
            }
        }

        // Auto-test on page load
        window.onload = () => {
            setTimeout(testHealth, 1000);
        };
    </script>
</body>
</html>
